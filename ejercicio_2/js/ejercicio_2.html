<!DOCTYPE html>
<html>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <h1>Formulario de reserva</h1>
          <p>Registre su información para reservar una cancha de basketball,
            la información con <strong>*</strong> es obligatoria.
          </p>
          <p>Recuerda revisar tu información con cuidado, o la reserva podría cancelarse.</p>
          <link rel="stylesheet" href="../css/styles.css">
        </header>


        <form class="contact-form"
        action="*"
        method="post">
          
          <section class="form-block">
              <h1>Datos del Reservante</h1>             
              <div class="form-grid">
                  <div class="form-field">
                    <label for="nombre">Nombre
                    <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                  <input type="text"
                  placeholder="Yotsuba"
                  name="nombre"
                  id="nombre"
                  required>
                  </div>

                  <div class="form-field">
                    <label for="apellido">Apellido
                    <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                    <input type="text"
                      placeholder="Nakano"
                      name="apellido"
                      id="apellido"
                      required>
                  </div>
              </div>
              <div class="form-grid">
                
                <div class="form-field">
                  <label for="correo">Correo electrónico
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <input type="email"
                    placeholder="yotsuba.nakano@example.com"
                    name="correo"
                    id="correo"
                    required>
                  
                    
                </div>
                
                <div class="form-field">
                  <label for="contraseña">Telefono
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <input type="tel"
                    placeholder="+57 300 0000000"
                    name="telefono"
                    id="telefono"
                    minlength="11"
                    maxlength="15"
                    required>  
                </div>
                

              </div>
              <div class="form-grid"> 
    
                <div class="form-field"> 
    
                  <label for="fecha"> 
                    Fecha de la reserva<span class="requiered-mark" aria-hidden="true">*</span> 
                  </label> 
    
                  <input 
                    type="date" 
                    id="fecha" 
                    name="fecha"
                    required 
                  > 
    
                </div> 
    
                <div class="form-field"> 
    
                  <label for="hora"> 
                    Hora de la reserva<span class="requiered-mark" aria-hidden="true">*</span> 
                  </label> 
    
                  <input 
                    type="time" 
                    id="hora" 
                    name="hora" 
                    required
                  > 
    
                </div> 
    
              </div>
              <div class="form-field">
                <label for="asistentes">Número de asistentes<span class="requiered-mark" aria-hidden="true">*</span></label>
                
                <input type="number"
                id="asistentes"
                name="asistentes"
                min="1"
                max="50"
                value="1"
                
                required>
                

              </div> 
              <div class="form-field"> 
 
                <label for="mensaje"> 
                  Describa su necesidad 
                </label> 
      
                <textarea 
                  id="mensaje" 
                  name="mensaje" 
                  rows="7" 
                  maxlength="1200" 
                  placeholder="Cuéntenos brevemente si tiene comentarios sobre su reserva..." 
                ></textarea> 
      
                <small class="field-help"> 
                  Máximo 1200 caracteres. 
                </small> 
    
               </div> 

            <label class="choice"> 
              <input 
                type="checkbox" 
                name="datos" 
                required 
              > 
    
              <span> 
                Autorizo el tratamiendo de mis datos. 
              </span> 
            </label>

            <div class="form-actions"> 
    
              <button 
                type="submit" 
                class="button button-primary" 
              > 
                Registrarse 
              </button> 
    
              <button
                type="reset" 
                class="button button-secondary" 
              > 
                Limpiar información 
              </button> 
    
            </div>  
          </section>
          <div class="brand">
          <span class="brand-name">Canchas de Basket sol naciente®</span>
          </div>
        </div>
      </form> 
  </section>
  </main>
</body>
</html>
