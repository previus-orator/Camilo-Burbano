<!DOCTYPE html>
<html>
<body>
  <main class="form-page">
    <section class="form-section">
      <img src="../img/logo1.jpg" alt="Logo de la empresa" class="brand-logo">
      <div class="form-container">
        <header class="form-header">
          <h1>Formulario de afiliación</h1>
          <p>Adjunte su información para poder registrarse en nuestra página web
            (Y disfrutar los mejores descuentos en pescados)
          </p>
          <link rel="stylesheet" href="../css/styles.css">
        </header>


        <form class="contact-form"
        action="*"
        method="post">
          
          <section class="form-block">             
              <div class="form-grid">
                  <div class="form-field">
                    <label for="nombre">Nombre
                    <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                  <input type="text"
                  placeholder="Itsuki"
                  name="nombre"
                  id="nombre"
                  required>
                  </div>

                  <div class="form-field">
                    <label for="apellido">Apellido
                    <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                    <input type="text"
                      placeholder="Nakano"
                      name="apellido"
                      id="apellido"
                      required>
                  </div>
              </div>
              <div class="form-grid">
                
                <div class="form-field">
                  <label for="correo">Correo electrónico
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <input type="email"
                    placeholder="itsuki.nakano@example.com"
                    name="correo"
                    id="correo"
                    required>
                  
                    
                </div>
                
                <div class="form-field">
                  <label for="contraseña">Contraseña
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <input type="password"
                    placeholder="escribe una contraseña segura"
                    name="contraseña"
                    id="contraseña"
                    minlength="8"
                    aria-describedby="descripción"
                    required>
                  <small id="descripción">Te recomendamos una contraseña con números, caracteres especiales
                  y mayúsculas, ¡protege tus descuentos de nuestro domingo de pasta!.</small>  
                </div>
                

              </div>

            <label class="choice"> 
              <input 
                type="checkbox" 
                name="datos" 
                required 
              > 
    
              <span> 
                Autorizo el tratamiendo de mis datos. 
              </span> 
            </label>

            <label class="choice"> 
              <input 
                type="checkbox" 
                name="terminos" 
                required 
              > 
    
              <span> 
                Acepto los <a href="https://www.youtube.com/watch?v=wLkfz10Srxw">terminos y condiciones</a>. 
              </span> 
            </label>

            <div class="form-actions"> 
    
              <button 
                type="submit" 
                class="button button-primary" 
              > 
                Registrarse 
              </button> 
    
              <button
                type="reset" 
                class="button button-secondary" 
              > 
                Limpiar información 
              </button> 
    
            </div>  
          </section>
          <div class="brand">
          <span class="brand-name">Asian Food®</span>
          </div>
        </div>
      </form> 
  </section>
  </main>
</body>
</html>
